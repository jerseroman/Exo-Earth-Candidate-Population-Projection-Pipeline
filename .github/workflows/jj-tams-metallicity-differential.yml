name: Differential metallicity TAMS audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    # Licensing boundary: third-party model acquisition and exports stay private.
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.10'}
      - name: Verify bundled TAMS table lock
        run: |
          python scripts/verify_locked_inputs.py \
            --check huber_parsec_tams_table=research/jj-host-export/reference-data/tams_parsec_danxhuber.txt
      - name: Install dependencies
        run: python -m pip install 'numpy==1.23.5' 'scipy==1.10.1' 'astropy==5.3.4' 'matplotlib==3.7.5' 'fast-histogram==0.14' 'requests>=2.28'
      - name: Test low-mass TAMS coverage guard
        run: python -m unittest discover -s research/jj-host-export -p 'test_*.py' -v
      - name: Checkout pinned JJ
        run: |
          git clone https://github.com/askenja/jjmodel.git /tmp/jjmodel-src
          cd /tmp/jjmodel-src
          git checkout 2828a2e8bfc379ba9c8ef4b4d0477ab5febe3b54
          python -m pip install -e .
      - name: Download JJ Padova isochrones
        run: |
          python scripts/fetch_locked_inputs.py \
            --id jj_padova_multiband_archive \
            --output /tmp/multiband_padova.zip \
            --accept-terms jj_padova_multiband_archive
          python - <<'PY'
          import shutil
          from pathlib import Path
          from jjmodel import localpath

          destination = Path(localpath) / 'input' / 'isochrones' / 'Padova'
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.unpack_archive('/tmp/multiband_padova.zip', destination)
          PY
      - name: Prepare JJ dR=0.5
        run: |
          mkdir -p /tmp/jj-diff results/metallicity-differential
          cp /tmp/jjmodel-src/jjmodel/tutorials/tutorial2/parameters /tmp/jj-diff/parameters
          cp /tmp/jjmodel-src/jjmodel/tutorials/tutorial2/sfrd_peaks_parameters /tmp/jj-diff/sfrd_peaks_parameters
          sed -E -i 's/^(Rmin[[:space:]]+)4([[:space:]])/\14.0\2/' /tmp/jj-diff/parameters
          sed -E -i 's/^(Rmax[[:space:]]+)14([[:space:]])/\114.0\2/' /tmp/jj-diff/parameters
          sed -E -i 's/^(dR[[:space:]]+)1([[:space:]])/\10.5\2/' /tmp/jj-diff/parameters
          sed -i 's/float(p.dR) == 1.0/float(p.dR) == 0.5/' research/jj-host-export/run_jj_export.py
          sed -i 's/JJ 1-kpc grid/JJ 0.5-kpc grid/' research/jj-host-export/run_jj_export.py
      - name: Regenerate JJ assemblies
        run: |
          python research/jj-host-export/run_jj_export.py --jj-root /tmp/jjmodel-src --run-dir /tmp/jj-diff --out "$GITHUB_WORKSPACE/results/metallicity-differential" --iso Padova
      - name: Export parent with FeH and canonical TAMS flags
        run: |
          python research/jj-host-export/tams_ab_test.py --jj-root /tmp/jjmodel-src --run-dir /tmp/jj-diff --out "$GITHUB_WORKSPACE/results/metallicity-differential" --iso Padova
      - name: Run differential metallicity TAMS sensitivity
        run: |
          python research/jj-host-export/metallicity_tams_differential_sensitivity.py \
            --input "$GITHUB_WORKSPACE/results/metallicity-differential/jj_g_hosts_parent_prelogg_padova.csv" \
            --reference-tams "$GITHUB_WORKSPACE/research/jj-host-export/reference-data/tams_parsec_danxhuber.txt" \
            --cache /tmp/parsec-metal-tracks \
            --out "$GITHUB_WORKSPACE/results/metallicity-differential"
          cat results/metallicity-differential/metallicity_tams_differential_sensitivity.json
      - name: Provenance and hashes
        run: |
          cat > results/metallicity-differential/PROVENANCE_METALLICITY_DIFFERENTIAL.md <<'EOF'
          # Differential metallicity-dependent PARSEC-TAMS coverage audit
          The frozen Berger/Huber R_TAMS(Teff) curve is retained as the absolute Z-solar baseline.
          The proposed differential construction is R_2D(T,FeH)=R_Huber(T)*R_PARSEC(T,FeH)/R_PARSEC(T,Z=0.017).
          Only finite phase-7 anchors with M<=2 Msun and R<10 Rsun are admissible.
          The script records FAIL_NOT_PUBLISHABLE and stops before host integration if any required metallicity curve does not cover 5300-6000 K without extrapolation.
          The archived quantitative metallicity-TAMS deltas are retracted and are excluded from the v4 baseline.
          No planet-occurrence, HZ, age, spatial, GHZ, or canonical host-selection factor is changed in this coverage audit.
          EOF
          sha256sum results/metallicity-differential/* | sort > results/metallicity-differential/SHA256SUMS_all.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: differential-metallicity-tams-audit
          path: results/metallicity-differential/
          if-no-files-found: error
          retention-days: 14
