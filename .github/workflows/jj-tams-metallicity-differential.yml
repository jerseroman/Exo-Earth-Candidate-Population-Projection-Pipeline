name: Differential metallicity TAMS audit
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NPY_DISABLE_CPU_FEATURES: AVX512F,AVX512CD,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"

jobs:
  audit:
    # Licensing boundary: third-party model acquisition and exports stay private.
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.10'}
      - name: Verify bundled TAMS table lock
        run: |
          python scripts/verify_locked_inputs.py \
            --check huber_parsec_tams_table=research/jj-host-export/reference-data/tams_parsec_danxhuber.txt
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          python -m pip check
          python "$GITHUB_WORKSPACE/scripts/verify_numerical_runtime.py" \
            --output results/metallicity-audit/NUMERICAL_RUNTIME_POLICY.json
      - name: Test low-mass TAMS coverage guard
        run: python -m unittest discover -s research/jj-host-export -p 'test_*.py' -v
      - name: Checkout pinned JJ
        run: |
          git clone https://github.com/askenja/jjmodel.git /tmp/jjmodel-src
          cd /tmp/jjmodel-src
          git checkout 2828a2e8bfc379ba9c8ef4b4d0477ab5febe3b54
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Download JJ Padova isochrones
        run: |
          python scripts/fetch_locked_inputs.py \
            --id jj_padova_multiband_archive \
            --output /tmp/multiband_padova.zip \
            --accept-terms jj_padova_multiband_archive
          python - <<'PY'
          import shutil
          from pathlib import Path
          from jjmodel import localpath

          destination = Path(localpath) / 'input' / 'isochrones' / 'Padova'
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.unpack_archive('/tmp/multiband_padova.zip', destination)
          PY
      - name: Prepare JJ dR=0.5
        run: |
          mkdir -p /tmp/jj-diff /tmp/metallicity-host
          cp /tmp/jjmodel-src/jjmodel/tutorials/tutorial2/parameters /tmp/jj-diff/parameters
          cp /tmp/jjmodel-src/jjmodel/tutorials/tutorial2/sfrd_peaks_parameters /tmp/jj-diff/sfrd_peaks_parameters
          sed -E -i 's/^(Rmin[[:space:]]+)4([[:space:]])/\14.0\2/' /tmp/jj-diff/parameters
          sed -E -i 's/^(Rmax[[:space:]]+)14([[:space:]])/\114.0\2/' /tmp/jj-diff/parameters
          sed -E -i 's/^(dR[[:space:]]+)1([[:space:]])/\10.5\2/' /tmp/jj-diff/parameters
          # Limit only runtime process parallelism to the two cores exposed by
          # the hosted runner; the scientific configuration is unchanged.
          sed -E -i 's/^(nprocess[[:space:]]+)4([[:space:]])/\12\2/' /tmp/jj-diff/parameters
          grep -Eq '^nprocess[[:space:]]+2[[:space:]]' /tmp/jj-diff/parameters
          grep -E '^(nprocess|Rmin|Rmax|dR)[[:space:]]' /tmp/jj-diff/parameters
      - name: Regenerate JJ assemblies
        run: |
          JJ_EXPORT_WORKING_BLOB="$(git hash-object "$GITHUB_WORKSPACE/research/jj-host-export/run_jj_export.py")"
          JJ_EXPORT_TRACKED_BLOB="$(git rev-parse HEAD:research/jj-host-export/run_jj_export.py)"
          [[ "$JJ_EXPORT_WORKING_BLOB" =~ ^[0-9a-f]{40}$ ]]
          [[ "$JJ_EXPORT_TRACKED_BLOB" =~ ^[0-9a-f]{40}$ ]]
          [[ "$JJ_EXPORT_WORKING_BLOB" == "$JJ_EXPORT_TRACKED_BLOB" ]]
          python "$GITHUB_WORKSPACE/research/jj-host-export/run_jj_export.py" --jj-root /tmp/jjmodel-src --run-dir /tmp/jj-diff --out /tmp/metallicity-host --iso Padova --expected-radial-step-kpc 0.5
      - name: Export parent with FeH and canonical TAMS flags
        run: |
          python "$GITHUB_WORKSPACE/research/jj-host-export/tams_ab_test.py" --jj-root /tmp/jjmodel-src --run-dir /tmp/jj-diff --out /tmp/metallicity-host --iso Padova
      - name: Fetch checksum-locked PARSEC metallicity-track archives
        run: |
          python scripts/fetch_locked_inputs.py \
            --output-dir /tmp/parsec-metal-tracks \
            --id parsec_tracks_z00005 \
            --id parsec_tracks_z0001 \
            --id parsec_tracks_z0002 \
            --id parsec_tracks_z0004 \
            --id parsec_tracks_z0006 \
            --id parsec_tracks_z0008 \
            --id parsec_tracks_z001 \
            --id parsec_tracks_z0014 \
            --id parsec_tracks_z0017 \
            --id parsec_tracks_z002 \
            --id parsec_tracks_z003 \
            --id parsec_tracks_z004
      - name: Run metallicity TAMS coverage audit
        run: |
          python "$GITHUB_WORKSPACE/research/jj-host-export/metallicity_tams_differential_sensitivity.py" \
            --input /tmp/metallicity-host/jj_g_hosts_parent_prelogg_padova.csv \
            --reference-tams "$GITHUB_WORKSPACE/research/jj-host-export/reference-data/tams_parsec_danxhuber.txt" \
            --cache /tmp/parsec-metal-tracks \
            --out "$GITHUB_WORKSPACE/results/metallicity-audit" \
            --data-locks "$GITHUB_WORKSPACE/provenance/DATA_LOCKS.json"
          cat results/metallicity-audit/metallicity_tams_differential_sensitivity.json
      - name: Provenance and hashes
        run: |
          cp \
            research/jj-host-export/PROVENANCE_METALLICITY_DIFFERENTIAL.md \
            results/metallicity-audit/PROVENANCE_METALLICITY_DIFFERENTIAL.md
          (
            cd results/metallicity-audit
            sha256sum \
              NUMERICAL_RUNTIME_POLICY.json \
              PROVENANCE_METALLICITY_DIFFERENTIAL.md \
              metallicity_tams_differential_sensitivity.json \
              native_solar_tams_nodes.csv \
              > SHA256SUMS_all.txt
            sha256sum --check SHA256SUMS_all.txt
          )
      - name: Verify exact negative-validation artifact
        run: |
          python "$GITHUB_WORKSPACE/scripts/verify_metallicity_tams_audit.py" \
            --artifact-root results/metallicity-audit \
            --data-locks provenance/DATA_LOCKS.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: differential-metallicity-tams-audit
          path: results/metallicity-audit/
          if-no-files-found: error
          retention-days: 14
