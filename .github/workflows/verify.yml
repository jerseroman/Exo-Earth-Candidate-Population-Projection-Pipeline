name: Verify standalone v4 software

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install declared compatible dependencies
        run: python -m pip install -r requirements.txt
      - name: Run software-only acceptance suite
        run: make verify
      - name: Build deterministic license-cleared source package
        run: |
          make public-package
          archive="dist/$(awk 'NF == 2 {print $2}' dist/PUBLIC_SHA256SUMS)"
          test -f "$archive"
          python scripts/verify_public_package_roundtrip.py \
            --archive "$archive"
