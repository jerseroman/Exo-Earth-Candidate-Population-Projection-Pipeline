name: Verify standalone v4 software

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install declared compatible dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          python -m pip check
      - name: Run software-only acceptance suite
        run: make verify
      - name: Build deterministic license-cleared source package
        run: |
          make public-package
          archive="dist/$(awk 'NF == 2 {print $2}' dist/PUBLIC_SHA256SUMS)"
          test -f "$archive"
          python scripts/verify_public_package_roundtrip.py \
            --archive "$archive"
