name: Bryson v4 propagate corrected constant posterior

on:
  workflow_dispatch:
    inputs:
      production_run_id:
        description: Successful constant-production run ID from this repository
        required: true
        type: string
      production_run_sha:
        description: Exact 40-hex head SHA of the constant-production run
        required: true
        type: string
      posterior_manifest_sha256:
        description: Independently recorded SHA-256 of SHA256SUMS_constant_aggregate.txt
        required: true
        type: string
      host_run_id:
        description: Successful JJ host-export run ID from this repository
        required: true
        type: string
      host_run_sha:
        description: Exact 40-hex head SHA of the JJ host-export run
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  propagate:
    # Licensing boundary: frozen production artifacts stay private.
    if: ${{ github.event.repository.private == true }}
    name: Propagate corrected constant posterior
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install pinned propagation environment
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          python -m pip check

      - name: Download checksum-locked posterior and host artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PRODUCTION_RUN_ID: ${{ inputs.production_run_id }}
          PRODUCTION_RUN_SHA: ${{ inputs.production_run_sha }}
          POSTERIOR_MANIFEST_SHA256: ${{ inputs.posterior_manifest_sha256 }}
          HOST_RUN_ID: ${{ inputs.host_run_id }}
          HOST_RUN_SHA: ${{ inputs.host_run_sha }}
          EXPECTED_PRODUCTION_WORKFLOW: .github/workflows/bryson-v4-corrected-production.yml
          EXPECTED_HOST_WORKFLOW: .github/workflows/jj-g-host-export.yml
        run: |
          [[ "$PRODUCTION_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid production run ID' >&2; exit 1; }
          [[ "$HOST_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid host run ID' >&2; exit 1; }
          [[ "$PRODUCTION_RUN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid production run SHA' >&2; exit 1; }
          [[ "$HOST_RUN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid host run SHA' >&2; exit 1; }
          [[ "$POSTERIOR_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'Invalid posterior manifest SHA-256' >&2; exit 1; }
          gh api "repos/${GH_REPOSITORY}/actions/runs/${PRODUCTION_RUN_ID}" > /tmp/production-run.json
          jq -e \
            --arg workflow "$EXPECTED_PRODUCTION_WORKFLOW" \
            --arg sha "$PRODUCTION_RUN_SHA" \
            '.status == "completed" and .conclusion == "success" and .event == "workflow_dispatch" and .path == $workflow and .head_sha == $sha' \
            /tmp/production-run.json > /dev/null
          gh api "repos/${GH_REPOSITORY}/actions/runs/${HOST_RUN_ID}" > /tmp/host-run.json
          jq -e \
            --arg workflow "$EXPECTED_HOST_WORKFLOW" \
            --arg sha "$HOST_RUN_SHA" \
            '.status == "completed" and .conclusion == "success" and .event == "workflow_dispatch" and .path == $workflow and .head_sha == $sha' \
            /tmp/host-run.json > /dev/null
          mkdir -p /tmp/bryson-v4-posterior /tmp/jj-hosts
          gh run download "$PRODUCTION_RUN_ID" \
            --repo "$GH_REPOSITORY" \
            --name bryson-v4-corrected-posterior-constant \
            --dir /tmp/bryson-v4-posterior
          gh run download "$HOST_RUN_ID" \
            --repo "$GH_REPOSITORY" \
            --name jj-g-host-export-padova-dr05-tams-canonical \
            --dir /tmp/jj-hosts
          echo "$POSTERIOR_MANIFEST_SHA256  /tmp/bryson-v4-posterior/SHA256SUMS_constant_aggregate.txt" | sha256sum --check
          python "$GITHUB_WORKSPACE/scripts/verify_accepted_aggregate.py" \
            --artifact-root /tmp/bryson-v4-posterior \
            --branch constant \
            --expected-bryson-source-sha256 0bb479b0c94c4f793b95e4fa1e853973805c54d3de7e2a2acc2e51c05b70a586
          echo 'a2b6f407c70c236f2be9a9084f53fe9ba461f06aa5f44d6caae11696467e5a28  /tmp/jj-hosts/jj_g_hosts_raw_eligible_padova.csv' | sha256sum --check

      - name: Propagate joint samples
        run: |
          OUT="$GITHUB_WORKSPACE/results/bryson-v4-galactic-constant"
          python research/bryson-joint-posterior/propagate_hab2_joint_posterior.py \
            --hosts /tmp/jj-hosts/jj_g_hosts_raw_eligible_padova.csv \
            --samples /tmp/bryson-v4-posterior/joint_posterior_constant_for_galactic_propagation.csv.gz \
            --branch constant \
            --out "$OUT" \
            --cluster-bootstrap-replicates 1000 \
            --bootstrap-seed 2026082102 \
            --inner-chain-batches 8

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bryson-v4-galactic-posterior-constant-final
          path: results/bryson-v4-galactic-constant/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
