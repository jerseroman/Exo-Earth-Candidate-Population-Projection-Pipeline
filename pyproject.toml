[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exo-earth-candidate-population-projection-pipeline"
version = "4.0.3"
description = "Reproducible Kepler DR25 exo-Earth candidate population projection pipeline"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
authors = [{name = "Roman Jerše"}]
dependencies = [
  "numpy==1.23.5",
  "scipy==1.10.1",
  "pandas==1.5.3",
  "astropy==5.3.4",
  "emcee==3.1.6",
  "matplotlib==3.7.5",
  "fast-histogram==0.14",
  "requests>=2.28,<3",
]

[tool.setuptools]
packages = []
